{% extends "base.html" %}

{% block title %}Access Forbidden - Course Management System{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full text-center">
        <div class="text-6xl text-red-500 mb-4">🚫</div>
        <h1 class="text-4xl font-bold text-gray-900 mb-4">403 - Access Forbidden</h1>
        <p class="text-xl text-gray-600 mb-8">
            You don't have permission to access this resource.
        </p>
        <div class="space-y-4">
            <a href="{{ url_for('main.index') }}" 
               class="bg-primary hover:bg-primary-dark text-white px-6 py-3 rounded-md text-lg font-medium">
                Go Home
            </a>
            <br>
            <a href="{{ url_for('auth.login') }}" 
               class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-3 rounded-md text-lg font-medium">
                Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
